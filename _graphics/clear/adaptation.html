<!doctype html><html style="--w:1024px;--h:1024px"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><style>
.glyphbox{text-align:center;margin-top:40px}.glyphbox .glyph{font-size:360px}
svg.curve{position:absolute;left:0;top:430px;width:1024px;height:220px}
.path{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:auto;margin-bottom:70px;position:relative}
.stage{text-align:center}
.dot{width:26px;height:26px;border-radius:50%;background:var(--cyan);margin:0 auto 18px;box-shadow:0 0 20px var(--cyan)}
.stage b{display:block;font-size:22px;color:#fff;font-weight:700;line-height:1.2}
.stage span{display:block;font-size:16px;color:var(--muted);margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.line{position:absolute;top:10px;left:10%;right:10%;height:2px;background:linear-gradient(90deg,var(--cyan-soft),var(--cyan))}
</style></head><body class="dark"><div class="frame">
<div class="eyebrow">A — Adaptation</div>
<div class="title">Career evolution</div><div class="rule"></div>
<div class="glyphbox"><div class="glyph">A</div></div>
<div class="path"><div class="line"></div>
<div class="stage"><div class="dot"></div><b>Pro basketball</b><span>Where it started</span></div>
<div class="stage"><div class="dot"></div><b>Data science</b><span>Sports analytics</span></div>
<div class="stage"><div class="dot"></div><b>VR development</b><span>Immersive training</span></div>
<div class="stage"><div class="dot"></div><b>AI engineering</b><span>Applied AI</span></div>
<div class="stage"><div class="dot"></div><b>Automation architecture</b><span>Systems that run themselves</span></div>
</div>
<div class="footer"><span>SportsTechWest</span><span>Iterative growth &amp; evolution</span></div>
</div></body></html>
